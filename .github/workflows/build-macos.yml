name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.asset_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            python_arch: arm64
            asset_arch: arm64
          - runner: macos-15-intel
            python_arch: x64
            asset_arch: x86_64
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check desktop imports
        run: PYTHONPATH=src python -c "import main"
      - name: Build app
        run: python build.py
      - name: Set app version and archive
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          version=$(PYTHONPATH=src python -c 'from config import DEFAULT_CONFIG; print(DEFAULT_CONFIG["version"])')
          app="RenpyLens_${version}.app"
          python - "$app" "$version" <<'PY'
          import plistlib
          import sys
          from pathlib import Path
          path = Path(sys.argv[1]) / "Contents" / "Info.plist"
          with path.open("rb") as handle:
              info = plistlib.load(handle)
          info["CFBundleShortVersionString"] = sys.argv[2].removeprefix("v")
          info["CFBundleVersion"] = sys.argv[2].removeprefix("v")
          info["CFBundleIdentifier"] = "com.liuyuan-wen.RenpyLens"
          with path.open("wb") as handle:
              plistlib.dump(info, handle)
          PY
          file "$app/Contents/MacOS/RenpyLens_${version}"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "RenpyLens_${version}_macos_${ASSET_ARCH}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos_${{ matrix.asset_arch }}
          path: RenpyLens_*_macos_${{ matrix.asset_arch }}.zip
          if-no-files-found: error
          retention-days: 7
